<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eeeeff;
    }

    .calculator {
      max-width: 450px;
      margin: 80px auto;
      padding: 25px;
      background-color: rgb(0, 128, 77);
      border-radius: 10px;
    }

    .inputs {
      display: flex;
      gap: 15px;
    }

    input {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid rgb(225, 65, 65);
      border-radius: 6px;
      background-color: #1538a0;
      color: white;
      font-size: 18px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin: 15px 0;
    }

    button {
      flex: 1;
      padding: 8px;
      background-color: rgb(65, 225, 137);
      color: white;
      border: 1px solid white;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: blue;
    }
  </style>
</head>

<body>
  <div class="calculator">
    <div class="inputs">
      <input type="number" id="firstNumber"
        placeholder="First number" aria-label="First number">

      <input type="number" id="secondNumber"
        placeholder="Second number" aria-label="Second number">
    </div>

    <div class="buttons">
      <button onclick="calculate('/')">/</button>
      <button onclick="calculate('*')">*</button>
      <button onclick="calculate('+')">+</button>
      <button onclick="calculate('-')">-</button>
      <button onclick="calculate('%')">%</button>
      <button onclick="calculate('**')">^</button>
    </div>

    <input type="text" id="result"
      placeholder="Result" aria-label="Result" readonly>
  </div>

  <script>
    function calculate(operator) {
      const firstInput = document.getElementById("firstNumber");
      const secondInput = document.getElementById("secondNumber");
      const resultBox = document.getElementById("result");

      // Check that both inputs contain numbers.
      if (firstInput.value === "" || secondInput.value === "") {
        resultBox.value = "Please enter both numbers";
        return;
      }

      // Convert the input values from text to numbers.
      const first = Number(firstInput.value);
      const second = Number(secondInput.value);

      let answer;

      if (operator === "+") {
        answer = first + second;
      } else if (operator === "-") {
        answer = first - second;
      } else if (operator === "*") {
        answer = first * second;
      } else if (operator === "/") {
        if (second === 0) {
          resultBox.value = "Cannot divide by zero";
          return;
        }

        answer = first / second;
      } else if (operator === "%") {
        if (second === 0) {
          resultBox.value = "Cannot find remainder with zero";
          return;
        }

        answer = first % second;
      } else if (operator === "**") {
        answer = first ** second;
      }

      // Display the answer.
      resultBox.value = answer;
    }
  </script>
</body>
</html>
